<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIPPOP PRINCESS OT40 RANKING</title>
    <style>
        :root { --primary: #ff6b6b; --bg: #f8f9fa; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        #container { max-width: 500px; width: 100%; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); text-align: center; box-sizing: border-box; }
        .progress-container { width: 100%; background: #eee; height: 10px; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--primary); transition: 0.3s; }
        .choices { display: flex; gap: 12px; margin-bottom: 20px; }
        .card { flex: 1; border: 3px solid #f0f0f0; border-radius: 15px; cursor: pointer; background: #fff; transition: 0.2s; overflow: hidden; }
        .card:active { transform: scale(0.95); border-color: var(--primary); }
        .img-box { width: 100%; aspect-ratio: 1/1; background: #eee; overflow: hidden; pointer-events: none; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .name { padding: 12px 5px; font-weight: bold; font-size: 0.9rem; min-height: 45px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        #result { display: none; text-align: left; }
        .result-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .result-rank { width: 35px; font-weight: bold; color: var(--primary); }
        .result-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin: 0 15px; border: 1px solid #ddd; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div id="container">
    <h3 id="main-title">點擊你更喜歡的參賽者👑</h3>
    <div id="game-ui">
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div class="choices">
            <div class="card" onclick="pick(0)">
                <div class="img-box"><img id="img-l" src=""></div>
                <div class="name" id="name-l">-</div>
            </div>
            <div class="card" onclick="pick(1)">
                <div class="img-box"><img id="img-r" src=""></div>
                <div class="name" id="name-r">-</div>
            </div>
        </div>
    </div>
    <div id="result">
        <div id="result-list"></div>
        <button class="btn" onclick="window.location.reload()">重新開始</button>
    </div>
</div>

<script>
// 使用最強力的 Google Drive 縮圖接口（通常能繞過封鎖）
function getImgUrl(url) {
    const match = url.match(/[-\w]{25,}/);
    if (!match) return "https://placehold.co/300x300?text=Error";
    const id = match[0];
    // 修正後的正確 Google Drive 圖片接口
    return `https://drive.google.com/uc?export=view&id=${id}`;
}


const raw = [
    {n:"Choi gayoon", i:"1XbM3T6trFiR_aeQW5NJHzXvHkQGFY53v"},
    {n:"Choi you min", i:"1IX2cbpkiYQkLVaCXxLgfPwu2Ad9YWoSX"},
    {n:"Han heeyeon", i:"1xgnOk1OrR_dsS0ZveQ9KjRp7Agw_TKzz"},
    {n:"Kim chaerin", i:"1TVRUQaeqRlzOouuNEjy_kE0A_4A5IJBK"},
    {n:"Kim doyi", i:"1t5uzMbz8e4zqoinJyJAvNXvvNDPZdz8q"},
    {n:"Kim sujin", i:"1Kd8AbdDQVmtAlnYMcf5DY0Y-QSpTvPt9"},
    {n:"Kim yeeun", i:"1XPGVVWQSmdR8FdcMPfJ_uvF6ObgDYz2l"},
    {n:"Kwon dohee", i:"1XMCwyZZN7cquEDkLC7O42rFajwm14z4x"},
    {n:"Lee chaehyun", i:"1gqDWFbVBbD5B_QZ-d9S5ElmRc2CXeBBQ"},
    {n:"Lee chaeyeon", i:"1aX6D_pjr9H0MVlmOOSGWLMs-CWYe5vF5"},
    {n:"Lee jooeun", i:"1-3M5x9RGveZDiZLFOcjTCySMRwzpmxyt"},
    {n:"Lee seohyun", i:"1ZFjPjX6rqDijNaXRt4ZogKnNdsbOvS78"},
    {n:"Min Jiho", i:"1v1dXRV1IhdVhCY4bn_imzuvI1Lw_k4HH"},
    {n:"Nam yuju", i:"1Kipv-eVZHsHwDdaOKvpBJCn0Oc-Yd-3G"},
    {n:"Ryu hajin", i:"1QxUVp_C72ntcRvyR2CJhsjnqN4KhA4xK"},
    {n:"Shin yookyung", i:"1zsY4WBa2m18veazleM98yPeaHRcGRati"},
    {n:"Yang jaeyun", i:"1hNU4SCOdiHGb2LvhoxLyp1uWtvMzDdm2"},
    {n:"Yoon chaeeun", i:"1Yh7QdMxubCI-nvm0WgW2sSF8qRDBizBT"},
    {n:"Yoon sooin", i:"1vRyCbu880vw3AE9duDtzwnqswSvEJkXh"},
    {n:"Yun seoyoung", i:"1rNCBdE3nYeUPOTA-lxwxPlHDQBhZYmpK"},
    {n:"Cocoro", i:"1wAj_dRupuEDA5paYUbRlCstYn2ve3TJ4"},
    {n:"Hanabi", i:"12g1ZZ4L-VNN7NBDcSZOa6H6UIpByn2bm"},
    {n:"Hina", i:"1VtZknWg406buptS8mElWvSvjms9sk1WD"},
    {n:"Karin", i:"1Yl8qeujZGzxrLzX82sQpXGkM0JxtAIRB"},
    {n:"Koko", i:"1jxBzgPPmxSqHbUEG4ET7IDCFg8cqZSY0"},
    {n:"Mayu", i:"1yrUkVtKQ7Is-a_Uy2sZ7vq_t0V-hIAKv"},
    {n:"Mia", i:"1A4K_XPjMG7rcOkNOzmGRVMOxWE-WW9wN"},
    {n:"Mirika", i:"1WqwdBPgphZaiNKICbXPbQZjBUNP1lV2Y"},
    {n:"Miyabi", i:"15_VbPF5XSfh2AevaXiq7yWHIkMWHvGXz"},
    {n:"Nana", i:"1m0KpNFdaF6brEvWChOb8kLD4atNe02vG"},
    {n:"Natsuho", i:"1FQc9wTnC3_gTlv34zwCciZwEuDrRnI1h"},
    {n:"Niko", i:"1nqZj9xKzJ2D3S0Z4dVoX7A5JSvBJVkL4"},
    {n:"Rino", i:"1l-ws21G3j8XVCtQTav3RP-QEBdfeYO1X"},
    {n:"Saaya", i:"1uNLPQSOFFixEBK55S0gQcnC9ph-t35Gl"},
    {n:"Sasa", i:"1fj7I9ZMVm0mAwvP8rxnDaxSz-MSqd44V"},
    {n:"Sea", i:"1JwSpBDcPCg9AGlcO9UYTeq-yyry9ko0-"},
    {n:"Sena", i:"13JMFM13oGuYVuPA-o9c_J7wwAIxr66bb"},
    {n:"Shiho", i:"1wlE7V2HfXvuN807y016uU0o8H9amLRsn"},
    {n:"Urara", i:"1MQoByvKljpYuDku8efZ4XFtHwbyXG5PK"},
    {n:"Yunon", i:"1V36-gsDU_UVo-OYoK-FTeYr14fE9Zue6"}
];

const data = raw.map(v => ({ n: v.n, i: getImgUrl(v.i) }));
let workList = data.map(x => [x]);
let pending = [], nextRound = [], leftArr = [], rightArr = [], merged = [], lIdx = 0, rIdx = 0, steps = 0;

function setup() {
    if (workList.length <= 1) { showRes(workList[0]); return; }
    pending = []; nextRound = [];
    for (let i = 0; i < workList.length; i += 2) {
        if (i+1 < workList.length) pending.push({ a: workList[i], b: workList[i+1] });
        else nextRound.push(workList[i]);
    }
    document.getElementById('main-title').innerText = "點擊你更喜歡的成員";
    go();
}

function go() {
    if (pending.length === 0) { workList = nextRound; setup(); return; }
    let t = pending.shift(); leftArr = t.a; rightArr = t.b;
    lIdx = 0; rIdx = 0; merged = [];
    draw();
}

function draw() {
    document.getElementById('img-l').src = leftArr[lIdx].i;
    document.getElementById('name-l').innerText = leftArr[lIdx].n;
    document.getElementById('img-r').src = rightArr[rIdx].i;
    document.getElementById('name-r').innerText = rightArr[rIdx].n;
    steps++;
    document.getElementById('progress-bar').style.width = Math.min((steps/195)*100, 99) + "%";
}

function pick(side) {
    if (side === 0) { merged.push(leftArr[lIdx]); lIdx++; }
    else { merged.push(rightArr[rIdx]); rIdx++; }
    if (lIdx < leftArr.length && rIdx < rightArr.length) draw();
    else { nextRound.push(merged.concat(leftArr.slice(lIdx)).concat(rightArr.slice(rIdx))); go(); }
}

function showRes(final) {
    document.getElementById('game-ui').style.display = 'none';
    document.getElementById('main-title').innerText = "排序完成！";
    const res = document.getElementById('result');
    const list = document.getElementById('result-list');
    res.style.display = 'block';
    final.forEach((it, i) => {
        list.innerHTML += `<div class="result-item"><div class="result-rank">${i+1}</div><img class="result-img" src="${it.i}"><div>${it.n}</div></div>`;
    });
}
setup();
</script>
</body>
</html>
